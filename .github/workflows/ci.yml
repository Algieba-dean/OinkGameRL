name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

jobs:
  tests:
    name: Run Pytest and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 确保安装了 pytest-cov 等所有 dev 依赖
        run: uv sync --all-extras --dev

      - name: Run pytest
        # 注意：这里去掉了 'tests' 参数，因为 pyproject.toml 里已经配置了 testpaths = ["tests"]
        # uv run pytest 会自动读取 addopts 中的 --cov 参数并生成报告
        run: uv run pytest

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        # 使用 if: always() 确保即使测试挂了（比如断言失败），你依然能拿到覆盖率报告来分析原因
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
