[project]
name = "board-games"
version = "0.1.0"
description = "Board game environments for reinforcement learning, including Oink Games and Chinese card games"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "gymnasium>=1.2.2",
    "numpy>=2.3.5",
    "pydantic>=2.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["games"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.1",
    "mypy>=1.18.2",
]

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
# with build-system, pythonpath actually is not needed, but can keep it for safe
pythonpath = "."
testpaths = ["tests"]
addopts = "-v --cov=core --cov=games --cov-report=term-missing --cov-report=html"

# ============================================================
# Coverage Configuration
# ============================================================
[tool.coverage.run]
omit = ["*/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

# ============================================================
# Ruff Configuration (Linter & Formatter)
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PT", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "PT011"] # allow use assert(S101 in tests

[tool.ruff.lint.isort]
known-first-party = ["games"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
