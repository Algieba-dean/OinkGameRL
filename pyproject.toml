[project]
name = "oink-games"
version = "0.1.0"
description = "Try to simulate oink games for RL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.2",
    "numpy>=2.3.5",
    "pydantic>=2.12.4",
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
