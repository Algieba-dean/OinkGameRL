name: CI

on:
  # 允许手动触发（调试必加）
  workflow_dispatch:

  # 监听 master 分支的推送
  push:
    branches:
      - master

  # 监听针对 master 的 PR
  pull_request:
    branches:
      - master

  # 定时任务：每天 UTC 0点 (北京时间 8点)
  schedule:
    - cron: "0 0 * * *"

jobs:
  tests:
    name: Run Pytest with uv
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 安装依赖 (同时包含 dev 依赖)
      - name: Install dependencies
        run: uv sync --all-extras --dev

      # 运行测试
      - name: Run pytest
        run: uv run pytest tests
